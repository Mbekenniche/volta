# Checks every pull request, and main after each merge. No job holds a secret: none of them
# reads the state or the cloud. Every action is pinned to a commit, its release in a comment.
name: checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The hooks of .pre-commit-config.yaml, then gitleaks over the whole history.
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false
      - name: Install pre-commit
        run: pipx install pre-commit==4.7.0
      - name: Run the hooks
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Scan the history for secrets
        run: pre-commit run --hook-stage manual gitleaks-history --all-files

  # Both OpenTofu stacks, without their backend.
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false
      - name: Validate infra
        run: |
          tofu -chdir=infra init -backend=false -input=false
          tofu -chdir=infra validate
      - name: Validate infra/bootstrap
        run: |
          tofu -chdir=infra/bootstrap init -backend=false -input=false
          tofu -chdir=infra/bootstrap validate

  # Every Application rendered the way Argo CD does, then validated by kubeconform.
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/
      - name: Render and validate
        run: scripts/render-apps.sh
