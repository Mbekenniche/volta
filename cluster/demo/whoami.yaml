apiVersion: v1
kind: Namespace
metadata:
  name:  demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name:  whoami
  namespace: demo
  labels:
    name:  whoami
spec:
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app:  whoami
    spec:
      containers:
      - image:  traefik/whoami:v1.12.0
        name:  whoami
        ports:
        - containerPort:  80
          name:  http
      restartPolicy: Always
---
kind: Service
apiVersion: v1
metadata:
  name:  whoami
  namespace: demo
spec:
  selector:
    app:  whoami
  type:   ClusterIP
  ports:
  - name:  http
    port:  80
    targetPort:  80
---
kind: Middleware
apiVersion: traefik.io/v1alpha1
metadata:
  name: redirect-https
  namespace: demo
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: demo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.middlewares: demo-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - demo.volta.koveolabs.com
    secretName: whoami-tls
  rules:
  - host: demo.volta.koveolabs.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: whoami
            port:
              number: 80
