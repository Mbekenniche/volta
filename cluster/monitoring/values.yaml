alertmanager:
  enabled: false

grafana:
  admin:
    existingSecret: grafana-admin
prometheusOperator:
  admissionWebhooks:
    certManager:
      enabled: true

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy :
  enabled: false

kubeEtcd:
  service:
    enabled: false
  serviceMonitor:
    enabled: false
prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "csi-cinder-sc-delete"
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
    retentionSize: "8GiB"
    additionalScrapeConfigs: |
      - job_name: kube-etcd
        kubernetes_sd_configs:
          - role: node
        scheme: http
        relabel_configs:
          - source_labels: [__address__]
            regex: '(.+):\d+'
            replacement: '$1:2381'
            target_label: __address__
