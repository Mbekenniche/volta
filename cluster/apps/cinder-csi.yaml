apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cinder-csi
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
  - repoURL: 'https://kubernetes.github.io/cloud-provider-openstack'
    chart: openstack-cinder-csi
    targetRevision: 2.36.5
    helm:
      valueFiles:
      -  $values/cluster/cinder-csi/values.yaml
  - repoURL: 'https://github.com/Mbekenniche/volta.git'
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
